<h1>Sykkeldelisk katalogen '95 - BMX/TRIAL</h1>



<img src="/sp/sy/gifs/store/m4.gif>


<h2>BMX-Freestyle</h2>

Under den store skateboard boomen  i USA på midten av 70-tallet, var det
en som ikke ville være som alle andre. Bob Haro, en ung mann fra California
hadde drevet med BMX (Bicycle Moto Cross) i noen år, før
han fant ut tiden var inne til å prøve noe nytt, Han tok
med seg sykkelen til en av de mange skateparkene i området. Det som
nå skulle skje var begynnelsen på noe stort. Disse
første vinglete sykkelturene som stort sett endte med en stor
kul i hodet og masse skrubbsår var bare starten...Bob Haro regnes fortsatt
som en levende legende i BMX-FREESTYLE miljøet.
<p>
	En ny sport var født. Som med alt annet som er nytt og
spennende i USA, tok det ikke lang tid før mange andre hadde
fattet interesse for denne nye aktiviteten. På midten av 80-tallet hadde
BMX-FREESTYLE sin glansperiode. Alle ville ha BMX sykkel, og nesten alle fikk
det. Det krydde av forskjellige sykkelmerker, proff syklister med inntekt opp i
mot en million kroner i året var ikke uvanlig. Ting hadde virkelig begynt
å skje. I USA ble det dannet flere landsdekkende organisasjoner som
avholdt store mesterskap med store  pengepremier. BMX-FREESTYLE hadde blitt
stor industri...
<p>
	Mot slutten av 80-tallet kom den uungåelige nedgangsperioden. Salget av
sykler sank drastisk og flere fabrikker måtte stenge. Mange av topp
utøverne la opp og de 5-6 månedlige magasinene ble redusert
til ett. Det ble sagt at BMX-FREESTYLE var dødt. Men, mens dette
pågikk var det noen som aldri ga seg. Et generasjonsskifte var i emning og
sporten dreide i nye retninger.
<p>
	Fra å være et  kapitaltstyrt sirkus med store stjerner, glitter og stas
fikk sporten et helt annet preg. Den gikk UNDERGROUND.  Sporten ble etterhvert
slik vi kjenner den i dag. Utøverne har i mye
større grad blitt spesialister innen sine felt. Det er
utøverne selv som står for produkutviklingen, og som holder
konkurranser. Det store pengekjøret er det slutt på for de
fleste. Det er fortsatt noen få som tjener store penger, men det er de som
har startet produksjon av sykler og utstyr på egenhånd.
<p>
	Sporten har mye til felles  med de andre typiske ungdomsidrettene som
snowboard og skating. De bygger alle på den samme filosofien. Det er lov
å være annerledes.
<p>
Vi på <b>SYKKELDELISK</b> har valgt å følge dette budskapet.
Vi  våger å være annerledes. Ved å være den eneste
spesialforretningen i Norge for BMX-FREESTYLE føler vi at vi
markerer dette. Denne sesongen satser vi på SYKKELDELISK
større enn noensinne på nettopp BMX-FREESTYLE. Vi vil satse
på flere kvalitetsprodukter fra USA denne sesongen. Standard Bykes, Haro
Cycles, Bully American og Hoffman Bikes vil være våre hovedmerker. I
tillegg til å kunne tilby et meget godt utvalg av deler og utstyr har vi
også et team som sitter på mye erfaring og kunnskap. I vårt team
her på SYKKELDELISK har vi  en av Norges aller fremste
utøver av sporten. Han har deltatt på flere
treningssamlinger i  USA, har syklet mye sammen med de aller beste der borte.
Han kan også vise til gode plasseringer i NM og VM.
<p>
	Så, om du er aktiv, tidligere aktiv eller bare veldig nysgjerrig på
dette. Kom innom oss i Bogstadveien og prat med oss. Husk, SYKKELDELISK er ikke
bare en forretning det er en livsstil...
	See ya, Ken.
<p>
<h2>Bike Trial - Stor moro på liten sykkel!</h2>

Bike Trial er en forholdsvis ny idrett i Norge, og enkelt forklart går
sporten ut på at syklisten tar seg frem i seksjoner i vanskelig terreng
uten at føttene skal berøre underlaget.  Hver
berøring gir straffepoeng, og den syklisten som har færrest
poeng når konkurransen er over har vunnet. De ivrigste motorsykkeltrial
klubbene her hjemme har såvidt begynt å lukte på denne
varianten, mens ellers i verden arrangeres det både nasjonale og
internasjonale mesterskap med VM som det årlige
høydepunkt.
<p>
	Det konkurreres i to klasser - opp til 20 og 26 tommers
hjul - der
de minste syklene likner en del på en BMX Freestyle sykkel med meget lav
utveksling. Under kranktannhjulet er det en kraftig beskyttelsesplate som
gjør det mulig å kline sykkelen ned på steiner og
stubber uten å ødelegge kranken.  Bakhjulet er hele 2,5
tommer bredt med et spesielt trial mønster, og gir sammen med
forhjulet et helt utrolig grep på underlaget (lufttrykket skal være
så lavt at du nesten slår felgen ved kjøring i
terrenget). Bremsene er kraftige, og er enten av canti - lever eller hydraulisk
type. På de rimeligste Monty syklene brukes gode Shimano kopier, mens de
bedre utgavene har &Ograve;værsting -stoppere&Oacute; fra Magura.
<p>
	Obs! Synes du dette ser morsomt ut er det ingen ting i veien for å bygge
om en gammel BMX sykkel - vi hjelper deg med å skaffe det
nødvendige utstyret.
<p>
	I klassen for 26 tommers hjul likner syklene en del på normale
terrengsykler, bortsett fra at de to største klingene på
kranken er fjernet slik at  bakkeklaringen øker drastisk. En av
de beste syklene til denne klassen er Cannondale M - 800 &Ograve;Beast of the
East&Oacute;. Den har høyere bakkeklaring enn en vanlig MTB
samtidig som det fallende overrøret gir god klaring til utstyr
som du normalt sett ikke har lyst til å falle ned på. Ta av bar -
ends, skru av de to største kranktannhjulene, sett på
vanlige pedaler uten tåbøyle og reimer og senk setet helt
ned for maksimal bevegelsesfrihet. Dermed har du både terreng- og
trialsykkel i en og samme rigg. Tips: For å beskytte kranktannhjulet kan
du finne et utslitt 36 tenners tannhjul og slipe av tennene slik at det blir en
solid ring av det. Skru så dette på kranken, og dermed har du god
beskyttelse for det minste tannhjulet. I butikken har vi RockRing skiver av
meget kraftig kvalitet.

<h2>Når, hvor og med hvem?</h2>

Som nevnt har en del klubber som normalt driver med motorsykkel trial begynt
å lukte på denne idretten. De har ofte egne treningsfelt, og vi
garan-terer deg en rå opplevelse om du tar med deg en trial tråsykkel
ut i slikt terreng. I stedet for å sykle på normalt vis, benyttes det
en teknikk som går ut på at syklisten hopper sykkelen fremover
samtidig som bremsene benyttes til å stoppe sykkelen akkurat der du
ønsker. Til å begynne med er dette vanskelig, men
etterhvert vil du oppdage at stadig vanskeligere hindre kan forseres. Topp
ryttere som Ot PI (Monty`s stjerne) og Hans Rey (GT) spretter lett opp på
1,5 m høye murkanter, og hindre som bilvrak og tomme
kabeltromler forseres med den største
selvfølgelighet!

<h2>Våre trialmodeller</h2>

I tillegg til den allerede nevnte Cannondale M - 800, fører vi
spesielle modeller fra GT og Monty. Fra GT har vi Hans Rey`s egen modell med
6061 T - 6 aluminiumsramme og Magura hydrauliske bremser, mens vi fra Monty
(verdens største og mestvinnende merke innen BikeTrial)
lagerfører den rimeligste skikkelige trial sykkelen B - 219 CG
med canti - lever bremser, og ellers kan skaffe resten av utvalget på kort
tid.
