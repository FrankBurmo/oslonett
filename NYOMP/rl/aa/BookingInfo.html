<h2>Bookings & registrations</h2>
<p>
Bookings are registered by any agreement that make us confident and pulling 
least efforts and inconvenience. Normally that means that the bookings are 
kept by a deposit of 20% of the price of the expedition. The rest is to be 
paid 6 weeks before departure, wherafter the deposit are not guaranteed 
refundable. But normally we have more request than space available, so you
will normally get the deposit refunded. (We do not ask for any reasons,
because nobody is booking off expeditions like this freely.)
