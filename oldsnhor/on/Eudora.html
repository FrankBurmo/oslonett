<h1>EUDORA - mail program for PC og Mac</h1>
<img alt="" src=eudora-logo.gif>
<p>
<em>17. august 1994</em>
<p>
Oslonett er blitt norsk distributør av EUDORA fra  QUALCOMM.
<p>
Den kommersielle versjonen av Eudora er meget  godt egnet til bruk mot
Oslonett  Aksess. Ved hjelp  av  Eudora vil kunder  av Oslonett Aksess
kunne redusere oppkoblingstiden som brukes til elektronisk post.
<p>
Eudora  er et  program  for elektronisk  post som gir  full epostfunk-
sjonalitet  mellom PC'er og  MAC'er mot Unix  mail  (SMTP). Eudora vil
virke  både  gjennom et lokalt   nettverk   og via oppringt  asynkront
samband. Ved et  oppringt asynkront samband er  Eudora avhengig av  en
feilkorrigerende modemforbindelse (MNP4 eller V.42).
<p>
Eudora er   kompatibelt med  eksisterende eposttjenester (SMTP),  og er
lett å integrere mot tjenester i det lokale nettet eller mot oppringte
eposttilbydere som Oslonett.
<p>
Eudora   er meget  brukervennlig.  Det er   designet   for å maksimere
brukervennlighet og minimere frustrasjoner.  Brukere leser  og skriver
sine meldinger  når de selv  ønsker, og  velger selv  når de vil sende
meldingene  ut på nettet. Eudora  er lett  å installere, og programmet
krever ikke spesielle tilpasninger hos Oslonett.

<h2>Egenskaper:</h2>
<ul>
 <Li> Kan brukes både over serielle linjer og i et lokalt TCP/IP-nettverk.
 <Li> Lagrer meldinger lokalt, slik at meldinger kan leses og skrives
   uten å være oppkoblet på nettet.
 <Li> Filtrerer meldinger. 
   Meldinger vil automatisk kunne sorteres inn i brukerdefinerte 
   postbokser.
 <Li> Støtter vanlige tekstediteringsfunksjoner som velg, kopier, klipp, 
   legg inn og angre.
 <Li> Støtter mailinglister.
 <Li> Støtter vedlegg i form av filer.
   Hver melding kan inneholde en eller flere binære vedlegg (filer).
 <Li> Tilbyr hierarkiske postbokser
 <Li> Har støtte for Multipurpose Internet Mail Extensions (MIME).
   Denne egenskapen tillater overføring av filer og binære data.
 <Li> Benytter RFC-822 adresseregler
</ul>

Eudora leveres i dag både til PC og Macintosh.

<h2>Krav til maskinvare:</h2>
<em>Macintosh systemkrav:</em>
<ul>
 <Li> system 7 eller senere
 <Li> Ethernetkort, DDP/IP gateway eller modem
 <Li> minimum 340 K med RAM
</ul>

<em>PC systemkrav:</em>
<ul>
 <Li> IBM PC eller kompatibel (minimum 286 proceccor)
 <Li> MS Windows 3.1 eller senere
 <Li> Mus anbefales sterkt
 <Li> Ethernet-kort eller modem for seriell forbindelse
 <Li> Nettverksprogramvare som støtter WinSockAPI 1.1 
   (dette gjelder kun bruk via TCP/IP, ikke ved asynkron oppkobling)
 <Li> minst 640K med RAM
</ul>

<h2>PRIS:</h2>
<pre>
   1-bruker Masterlisens, inkludert manualer  : 650 NOK
   1-bruker Add-On lisens (krever master)     : 350 NOK
</pre>
