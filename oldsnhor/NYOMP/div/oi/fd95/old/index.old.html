 Mye tid, penger og tankearbeid settes inn i norsk forskning
 hvert år. Fruktene av innsatsen er ny viten, nye proukter
 og ny teknologi. Resultatene er livsnødvende for næringsliv,
 forvaltning og utdanning.

<p>

 Likevel er det mange som ikke vet hva forskning betyr for
 kunnskap, velferd og livskvalitet.
