Avtalen gjelder <strong>fra 1. mai 1994 til 30. april 1996.</strong>
     Den forlenges
automatisk for 1 år av gangen dersom ingen av partene sier den opp i
rekommandert brev med minst 3 måneders varsel. Reguleringer og
justeringsforhandlinger som bestemt i hovedtariffavtalen.<p>
